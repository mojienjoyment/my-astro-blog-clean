backend:
  name: github
  repo: mojienjoyment/my-clean-blog  # <-- CHANGE THIS!
  branch: main
  auth_type: pkce

media_folder: "public/images"
public_folder: "/images"

collections:
  - name: "posts"
    label: "Blog Posts"
    folder: "src/content/posts/en"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Short Description", name: "description", widget: "string" }
      - { label: "Publish Date", name: "pubDate", widget: "datetime", format: "YYYY-MM-DD" }
      - { label: "Tags (optional)", name: "tags", widget: "list", required: false }
      - { label: "Post Body", name: "body", widget: "markdown" }